name: (Data) Prune Expired Releases

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      apply:
        description: 'Delete old unreferenced release generations'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: r2-bucket-writers
  cancel-in-progress: false

jobs:
  prune:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Plan or prune retained releases
        env:
          R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          APPLY: ${{ github.event_name == 'schedule' || inputs.apply }}
        run: |
          args=()
          if [[ "$APPLY" == "true" ]]; then args+=(--write); fi
          npx tsx .github/scripts/prune-releases.ts "${args[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: retention-plan
          path: retention-plan.json
          retention-days: 30
