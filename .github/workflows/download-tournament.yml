# =============================================================================
# Download Tournament Report
# =============================================================================
# Downloads and processes individual tournament data from Limitless Labs.
# Use for adding specific tournaments to the dataset on-demand.
#
# Triggers:
#   - Manual dispatch only (requires tournament URL)
#
# Options:
#   - Anonymize player names for privacy
# =============================================================================

name: Download Tournament

run-name: >-
  Download Tournament${{ inputs.anonymize == true && ' (anonymized)' || '' }}

on:
  workflow_dispatch:
    inputs:
      limitless_url:
        description: 'Tournament reference: Labs URL/code or Limitless URL/ID (e.g., 0054, https://labs.limitlesstcg.com/0054/standings, https://limitlesstcg.com/tournaments/517, 517)'
        required: true
        type: string
      anonymize:
        description: 'Anonymize player names'
        required: false
        type: boolean
        default: false

# All R2 bucket writers share one concurrency group so producers and repair
# jobs can never mutate the bucket at the same time (DB-MASTER-PLAN Phase 0).
concurrency:
  group: r2-bucket-writers
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  download-tournament:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Validate tournament input
        env:
          INPUT: ${{ inputs.limitless_url }}
        run: |
          if [[ -z "$INPUT" ]]; then
            echo "Input is required."
            exit 1
          fi

          echo "Tournament input: $INPUT"

      - name: Checkout
        # actions/checkout@v5.0.0
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8

      - name: Setup Python
        # actions/setup-python@v6.0.0
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.11'

      - name: Setup Node.js
        # actions/setup-node@v5.0.0
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: |
          pip install -r .github/scripts/requirements.txt
          npm ci

      - name: Download and process tournament
        env:
          LIMITLESS_INPUT: ${{ inputs.limitless_url }}
          ANONYMIZE: ${{ inputs.anonymize }}
          R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ciphermaniac-reports
        run: python .github/scripts/download-tournament.py

      - name: Summary
        env:
          INPUT: ${{ inputs.limitless_url }}
          ANONYMIZED: ${{ inputs.anonymize == true && 'Yes' || 'No' }}
        run: |
          safe_input=$(printf '%s' "$INPUT" | tr '\r\n`' '   ')
          {
            echo "## Tournament Download"
            echo ""
            printf '%s\n' "- **Input**: \`$safe_input\`"
            printf '%s\n' "- **Resolved Input**: \`$safe_input\`"
            echo "- **Anonymized**: $ANONYMIZED"
          } >> "$GITHUB_STEP_SUMMARY"
