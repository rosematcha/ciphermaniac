# =============================================================================
# Ingest New Tournaments
# =============================================================================
# Daily scan for Limitless Labs tournaments missing from the dataset, replacing
# the manual per-event `Download Tournament` dispatch as the normal path. That
# manual-only path is how labs codes 0055-0071 went uningested for six months
# while every scheduled workflow kept reporting success.
#
# Runs at 13:00 UTC — before online meta / trends / player aggregation and the
# 15:00 release, so an event ingested in the morning reaches player profiles the
# same day.
# =============================================================================

name: (Daily Chore) Ingest New Tournaments

on:
  schedule:
    - cron: '0 13 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'List missing tournaments without downloading'
        required: false
        type: boolean
        default: true
      max_ingest:
        description: 'Maximum tournaments to ingest in this run'
        required: false
        type: string
        default: '5'

# All R2 bucket writers share one concurrency group so producers and repair
# jobs can never mutate the bucket at the same time (DB-MASTER-PLAN Phase 0).
concurrency:
  group: r2-bucket-writers
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ingest-new-tournaments:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r .github/scripts/requirements.txt

      - name: Ingest missing tournaments
        env:
          R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          # Scheduled runs carry no inputs and must actually write.
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
          MAX_INGEST: ${{ github.event.inputs.max_ingest || '5' }}
        run: python .github/scripts/ingest-new-tournaments.py
