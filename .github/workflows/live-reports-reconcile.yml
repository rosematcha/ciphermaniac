name: Live Reports Reconcile

on:
  # Botan dispatches this every 5 minutes because GitHub runs the cron a few
  # times a day. The cron is the fallback.
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions: {}

# Botan's dispatches and the cron can overlap; one run at a time, with at most
# one waiting. Separate from the release writers, since it writes live keys only.
concurrency:
  group: live-reports-reconcile
  cancel-in-progress: false

jobs:
  reconcile:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Reconcile committed live votes
        env:
          LIVE_RECONCILE_TOKEN: ${{ secrets.LIVE_RECONCILE_TOKEN }}
        run: >-
          curl --fail-with-body --silent --show-error
          -X POST https://ciphermaniac.pages.dev/api/live/reconcile
          -H "Authorization: Bearer $LIVE_RECONCILE_TOKEN"
