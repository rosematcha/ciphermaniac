# =============================================================================
# Tournament Idle Sweep
# =============================================================================
# Ends every organizer-run event that has gone two hours without a change
# (functions/api/tournaments/idle.ts). Pages Functions run on no timer, so
# this calls the sweep on a schedule. GitHub runs schedules late at busy
# times, so an event ends somewhere past its two hours. It calls the Pages
# address: Bot Fight Mode on ciphermaniac.com challenges runner IPs.
#
# Triggers:
#   - Every 15 minutes
#   - Manual dispatch
# =============================================================================

name: Tournament Idle Sweep

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  sweep:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: End idle events
        env:
          IDLE_SWEEP_TOKEN: ${{ secrets.IDLE_SWEEP_TOKEN }}
        run: >-
          curl --fail-with-body --silent --show-error
          -X POST https://ciphermaniac.pages.dev/api/tournaments/idle
          -H "Authorization: Bearer $IDLE_SWEEP_TOKEN"
