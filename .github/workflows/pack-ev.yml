# =============================================================================
# Pack EV
# =============================================================================
# Rebuilds the sealed-vs-singles artifacts behind /tools/pack-ev: for every set
# in config/pack-ev.json, the full card list with market prices and the sealed
# product prices, from TCGCSV.
#
# Triggers:
#   - Daily at 14:30 UTC (after the 14:00 price check, before the 15:00 release)
#   - Manual dispatch
#
# Blast radius: reports/pack-ev/*. Nothing else reads those keys, and a failed
# run leaves yesterday's artifacts in place.
# =============================================================================

name: (Daily Chore) Pack EV

run-name: >-
  ${{ github.event_name == 'schedule' && 'Pack EV' || 'Pack EV (manual)' }}

on:
  schedule:
    - cron: '30 14 * * *'
  workflow_dispatch:

# All R2 bucket writers share one concurrency group so producers and repair
# jobs can never mutate the bucket at the same time (DB-MASTER-PLAN Phase 0).
concurrency:
  group: r2-bucket-writers
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-pack-ev:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        # actions/checkout@v5.0.0
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8

      - name: Setup Node
        # actions/setup-node@v5.0.0
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build pack EV artifacts
        run: npx tsx .github/scripts/run-pack-ev.ts
        env:
          R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ciphermaniac-reports

      - name: Summary
        run: |
          {
            echo "## Pack EV"
            echo ""
            echo "Rebuilt reports/pack-ev/v2 from TCGCSV"
          } >> "$GITHUB_STEP_SUMMARY"
