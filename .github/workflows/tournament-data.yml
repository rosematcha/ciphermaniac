name: Tournament Data
on:
  schedule:
    - cron: '23 13 * * *'
    # Watchdog: labs posts a major's lists a day or so after it ends. The watch
    # job looks every half hour and only starts an ingest once one is final.
    - cron: '8,38 * * * *'
  push:
    branches: [main]
    paths:
      - 'shared/onlineMeta/player*.ts'
      - 'shared/playerTypes.ts'
      - 'shared/cardUtils.ts'
      - '.github/scripts/run-major-data.ts'
      - '.github/scripts/run-player-aggregator.ts'
      - '.github/scripts/run-majors-trends.ts'
      - 'src/lib/majorsTrends.ts'
  workflow_dispatch:
    inputs:
      event:
        description: Tournament URL or code (blank checks for new majors)
        type: string
        default: ''
      dry_run:
        description: Preview ingestion without modifying data
        type: boolean
        default: true
      force:
        description: Rebuild all player profiles
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
  checks: read
  deployments: write
jobs:
  watch:
    if: github.event.schedule == '8,38 * * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      pending: ${{ steps.scan.outputs.pending }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      - uses: ./.github/actions/setup
        with:
          python: 'true'
      - name: Look for finished majors
        id: scan
        run: python3 .github/scripts/ingest-new-tournaments.py
        env:
          R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME || 'ciphermaniac-reports' }}
          DRY_RUN: 'true'
  tournaments:
    needs: watch
    if: >-
      !cancelled() && github.ref == 'refs/heads/main' &&
      (needs.watch.result == 'skipped' || needs.watch.outputs.pending != '')
    runs-on: ubuntu-latest
    timeout-minutes: 150
    concurrency:
      group: r2-bucket-writers
      queue: max
      cancel-in-progress: false
    env:
      R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME || 'ciphermaniac-reports' }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GH_TOKEN: ${{ github.token }}
      LIMITLESS_INPUT: ${{ inputs.event }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
      FORCE_FULL_REBUILD: ${{ inputs.force || 'false' }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      - uses: ./.github/actions/setup
        with:
          python: 'true'
      - name: Require verified main commit
        run: npx tsx .github/scripts/require-verified-code.ts
      - name: Discover or ingest major events
        if: github.event_name != 'push'
        run: npx tsx .github/scripts/run-data-pipeline.ts tournaments
      - name: Build affected players and majors trends
        if: env.DRY_RUN != 'true'
        run: npx tsx .github/scripts/run-major-data.ts
      - name: Publish changed data
        if: env.DRY_RUN != 'true'
        uses: ./.github/actions/publish
