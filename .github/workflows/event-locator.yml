# =============================================================================
# Event Locator
# =============================================================================
# Publishes every upcoming League Cup, League Challenge, and Prerelease that
# Pokedata lists, for /events. Writes:
#   - events/v1/{run}/cells/{cell}.json (listings, sharded by 5-degree grid cell)
#   - events/v1/{run}/places.json (cities and stores, for instant search)
#   - events/v1/index.json (written last; points the browser at {run})
# and deletes the run before last. Each run gets its own folder, so a visitor
# holding an older index never reads a half-replaced listing.
#
# Then publishes locals (weekly store events) apart, as one record per store
# slot rather than one per week, three weeks ahead:
#   - events/locals/v1/cells/{cell}.json (only the cells whose content changed)
#   - events/locals/v1/index.json (only when something changed)
#
# Refuses to publish a listing under 60% of the published one (that is an
# upstream outage, not a quiet week) unless allow_shrink is ticked. Never
# publishes an empty one. Each listing is guarded on its own.
#
# Triggers:
#   - Daily at 10:00 UTC
#   - Manual dispatch
# =============================================================================

name: Event Locator

on:
  schedule:
    - cron: '0 10 * * *' # Daily at 10:00 UTC
  workflow_dispatch:
    inputs:
      allow_shrink:
        description: 'Publish even if the new listing is under 60% of the published one (never publishes an empty listing)'
        required: false
        type: boolean
        default: false

concurrency:
  group: event-locator
  queue: max
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish-events:
    runs-on: ubuntu-latest
    # The sanctioned pull is ~110 pages; the locals pull ~300, at a few seconds each.
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      - uses: ./.github/actions/setup
      - name: Publish event listings
        run: npx tsx .github/scripts/run-event-locator.ts
        env:
          R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          ALLOW_SHRINK: ${{ inputs.allow_shrink && 'true' || 'false' }}
