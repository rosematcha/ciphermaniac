name: Daily Data
on:
  # Botan dispatches this at 12:17 UTC because GitHub starts the cron 4 to 10
  # hours late. The cron is the fallback: see the slot job.
  schedule:
    - cron: '17 12 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Refresh again even if today's inputs already completed
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
  checks: read
  deployments: write
concurrency:
  group: r2-bucket-writers
  queue: max
  cancel-in-progress: false
jobs:
  # A scheduled start runs only after today's 12:17 UTC slot, and only while no
  # run since then has succeeded or is still open, so the day has one real run.
  # A start delayed past midnight waits for its own day's slot. A failed run
  # does not count, so the fallback retries it.
  slot:
    if: github.ref == 'refs/heads/main' && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      open: ${{ steps.check.outputs.open }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - id: check
        shell: bash
        run: |
          slot="$(date -u +%F)T12:17:00Z"
          # A failed lookup counts as no run, so the fallback runs rather than skips the day.
          if runs=$(gh run list -R "$GITHUB_REPOSITORY" --workflow daily-data.yml --branch main --created ">=$slot" \
            --json databaseId,status,conclusion); then
            taken=$(jq --argjson self "$GITHUB_RUN_ID" '[.[] | select(.databaseId != $self and (.status != "completed" or .conclusion == "success"))] | length' <<< "$runs")
          else
            echo "::warning::Could not list today's Daily Data runs; running"
            taken=0
          fi
          if [ "$(date -u +%H%M)" -ge 1217 ] && [ "$taken" -eq 0 ]; then open=true; else open=false; fi
          echo "open=$open" >> "$GITHUB_OUTPUT"
  daily:
    needs: slot
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && needs.slot.outputs.open != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME || 'ciphermaniac-reports' }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GH_TOKEN: ${{ github.token }}
      LIMITLESS_API_KEY: ${{ secrets.LIMITLESS_API_KEY }}
      FORCE_REFRESH: ${{ inputs.force || 'false' }}
      ONLINE_FETCH_CACHE: .cache/online-api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ./.github/actions/setup
        with:
          python: 'true'
      - name: Require verified main commit
        run: npx tsx .github/scripts/require-verified-code.ts
      - name: Online reports, trends, prices and pack EV
        run: npx tsx .github/scripts/run-data-pipeline.ts daily
      - name: Publish changed data
        uses: ./.github/actions/publish
      - name: Upload publication plan
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-plan
          path: release-plan.json
          if-no-files-found: ignore
