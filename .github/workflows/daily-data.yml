name: Daily Data
on:
  schedule:
    - cron: '17 12 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Refresh again even if today's inputs already completed
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
  checks: read
  deployments: write
concurrency:
  group: r2-bucket-writers
  queue: max
  cancel-in-progress: false
jobs:
  daily:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME || 'ciphermaniac-reports' }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GH_TOKEN: ${{ github.token }}
      LIMITLESS_API_KEY: ${{ secrets.LIMITLESS_API_KEY }}
      FORCE_REFRESH: ${{ inputs.force || 'false' }}
      ONLINE_FETCH_CACHE: .cache/online-api
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      - uses: ./.github/actions/setup
        with:
          python: 'true'
      - name: Require verified main commit
        run: npx tsx .github/scripts/require-verified-code.ts
      - name: Online reports, trends, prices and pack EV
        run: npx tsx .github/scripts/run-data-pipeline.ts daily
      - name: Publish changed data
        uses: ./.github/actions/publish
      - name: Upload publication plan
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-plan
          path: release-plan.json
          if-no-files-found: ignore
