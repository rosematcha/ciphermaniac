name: Card Assets
on:
  schedule:
    - cron: '37 6 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Refresh discovery and images even if inputs are unchanged
        type: boolean
        default: false
      formats:
        description: Explicit format ids (blank preserves the normal Expanded-only cadence)
        type: string
        default: ''
permissions:
  contents: read
  actions: read
  checks: read
  deployments: write
concurrency:
  group: r2-bucket-writers
  queue: max
  cancel-in-progress: false
jobs:
  assets:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME || 'ciphermaniac-reports' }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GH_TOKEN: ${{ github.token }}
      FORCE_REFRESH: ${{ inputs.force || 'false' }}
      REQUESTED_FORMATS: ${{ inputs.formats }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      - uses: ./.github/actions/setup
        with:
          python: 'true'
      - name: Install image-processing dependencies
        run: pip install -r .github/scripts/requirements-art.txt
      - name: Require verified main commit
        run: npx tsx .github/scripts/require-verified-code.ts
      - name: Restore downloaded card art
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .art-cache
          key: art-cache-${{ github.run_id }}
          restore-keys: art-cache-
      - name: Refresh changed card metadata and assets
        run: npx tsx .github/scripts/run-data-pipeline.ts assets
      - name: Refresh major derivatives when metadata changed
        run: npx tsx .github/scripts/run-major-data.ts
      - name: Publish changed data
        uses: ./.github/actions/publish
      - name: Upload publication plan
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-plan
          path: release-plan.json
          if-no-files-found: ignore
