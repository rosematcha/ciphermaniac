# =============================================================================
# Live Rounds (manual fallback)
# =============================================================================
# Polls RK9 pairings once a minute while a listed event is on, and publishes:
#   - live/v1/{slug}/r{round}.json (every table of the round)
#   - live/v1/{slug}/index.json (current round; what the browser polls)
# only when a round actually changes.
#
# The poller normally runs as a service on an always-on host, so that a job
# holding a runner for hours never queues the rest of Actions behind it. This
# workflow stays as the fallback: a dispatch polls for five and a half hours,
# under the six-hour job limit, resuming from the published index. With no
# event live it exits in seconds. Never run it alongside the service: both
# would write the same keys.
#
# Deliberately outside the r2-bucket-writers group: it writes only under live/,
# and holding that group for hours would stall every data job.
#
# Triggers:
#   - Manual dispatch only
# =============================================================================

name: Live Rounds

on:
  workflow_dispatch:

concurrency:
  group: live-rounds
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 345

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ./.github/actions/setup
      - name: Poll live rounds
        run: npx tsx .github/scripts/run-live-rounds.ts
        env:
          R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
