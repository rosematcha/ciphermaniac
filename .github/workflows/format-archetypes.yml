# =============================================================================
# Format Archetypes
# =============================================================================
# Refreshes the archetype snapshot behind the Tier List Maker's format picker.
#
# Only Expanded is on the schedule. The past formats in the same file are
# rotated out — their metagames cannot change, so re-scraping them would spend
# requests to write the bytes back unchanged. Add or rebuild one by dispatching
# this workflow with an explicit format id.
#
# Standard is not here at all: it comes from the Online Meta Report, which
# rebuilds it daily.
#
# Triggers:
#   - Monthly, on the 1st at 04:00 UTC (Expanded only)
#   - Manual dispatch, optionally for a specific format
# =============================================================================

name: (Card Metadata) Format Archetypes

run-name: >-
  ${{ github.event_name == 'schedule' && 'Monthly Expanded Refresh' ||
      format('Format Archetypes ({0})', inputs.formats || 'expanded') }}

on:
  schedule:
    - cron: '0 4 1 * *' # Monthly, 1st at 04:00 UTC
  workflow_dispatch:
    inputs:
      formats:
        description: 'Space-separated format ids, or "all" to rebuild every format'
        required: false
        type: string
        default: 'expanded'

# Shared with every other R2 bucket writer: this job mirrors sprites, and the
# bucket takes one writer at a time (DB-MASTER-PLAN Phase 0).
concurrency:
  group: r2-bucket-writers
  cancel-in-progress: false

jobs:
  scrape-format-archetypes:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install -r .github/scripts/requirements.txt

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Formats the run does not touch are carried through from the committed
      # file, so a partial scrape never empties the picker.
      #
      # Most of the runtime is the card-art pass: every archetype that clears
      # the share floor has its own deck page and a handful of its decklists
      # read for the cards it was built around. The monthly run pays that for
      # Expanded's three dozen archetypes and nothing else; the "all" dispatch
      # walks a hundred-odd and is why the timeout is what it is.
      - name: Scrape format archetypes
        run: |
          REQUESTED="${{ inputs.formats || 'expanded' }}"
          if [ "$REQUESTED" == "all" ]; then
            python .github/scripts/scrape-format-archetypes.py --all
          else
            ARGS=""
            for id in $REQUESTED; do ARGS="$ARGS --format $id"; done
            python .github/scripts/scrape-format-archetypes.py $ARGS
          fi

      # An unmirrored sprite loads cross-origin, which taints the canvas the
      # tier list exports through — so a newly surfaced archetype has to reach
      # R2 before the snapshot naming it reaches the site.
      - name: Mirror sprites to R2
        env:
          R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME || 'ciphermaniac-reports' }}
        run: npx tsx scripts/mirror-archetype-sprites.ts

      - name: Check for changes
        id: check_changes
        run: |
          if git diff --quiet src/data/format-archetypes.json; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "Snapshot unchanged"
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "Snapshot changed"
          fi

      - name: Commit and push changes
        if: steps.check_changes.outputs.has_changes == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          git add src/data/format-archetypes.json
          git commit -m "chore: refresh format archetype snapshot [skip ci]"
          git push

      - name: Summary
        run: |
          echo "## Format Archetypes" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Format | Field | Archetypes | Scraped |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|------------|---------|" >> $GITHUB_STEP_SUMMARY
          # Players on the ladder-sourced formats, championship points on the
          # tournament-ranking ones.
          jq -r '.formats[] | "| \(.label) | \(.players // .points) | \(.archetypes | length) | \(.scrapedAt) |"' \
            src/data/format-archetypes.json >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.check_changes.outputs.has_changes }}" == "true" ]; then
            echo "Snapshot committed." >> $GITHUB_STEP_SUMMARY
          else
            echo "No change — snapshot is up to date." >> $GITHUB_STEP_SUMMARY
          fi
