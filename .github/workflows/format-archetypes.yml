# =============================================================================
# Format Archetypes
# =============================================================================
# Refreshes the archetype snapshot behind the Tier List Maker's format picker.
#
# Only Expanded is on the schedule. The past formats in the same file are
# rotated out — their metagames cannot change, so re-scraping them would spend
# requests to write the bytes back unchanged. Add or rebuild one by dispatching
# this workflow with an explicit format id.
#
# Standard is not here at all: it comes from the Online Meta Report, which
# rebuilds it daily.
#
# Triggers:
#   - Monthly, on the 1st at 04:00 UTC (Expanded only)
#   - Manual dispatch, optionally for a specific format
# =============================================================================

name: (Card Metadata) Format Archetypes

run-name: >-
  ${{ github.event_name == 'schedule' && 'Monthly Expanded Refresh' ||
      format('Format Archetypes ({0})', inputs.formats || 'expanded') }}

on:
  schedule:
    - cron: '0 4 1 * *' # Monthly, 1st at 04:00 UTC
  workflow_dispatch:
    inputs:
      formats:
        description: 'Space-separated format ids, or "all" to rebuild every format'
        required: false
        type: string
        default: 'expanded'

# Shared with every other R2 bucket writer: this job mirrors sprites, and the
# bucket takes one writer at a time (DB-MASTER-PLAN Phase 0).
concurrency:
  group: r2-bucket-writers
  cancel-in-progress: false

jobs:
  scrape-format-archetypes:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install -r .github/scripts/requirements.txt

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Formats the run does not touch are carried through from R2, so a partial scrape never empties the picker.
      #
      # Most of the runtime is the card-art pass: every archetype that clears
      # the share floor has its own deck page and a handful of its decklists
      # read for the cards it was built around. The monthly run pays that for
      # Expanded's three dozen archetypes and nothing else; the "all" dispatch
      # walks a hundred-odd and is why the timeout is what it is.
      - name: Scrape format archetypes
        env:
          REQUESTED: ${{ inputs.formats || 'expanded' }}
          R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME || 'ciphermaniac-reports' }}
        run: |
          if [ "$REQUESTED" == "all" ]; then
            python .github/scripts/scrape-format-archetypes.py --publish --all
          else
            ARGS=(--publish)
            for id in $REQUESTED; do ARGS+=(--format "$id"); done
            python .github/scripts/scrape-format-archetypes.py "${ARGS[@]}"
          fi

      # An unmirrored sprite loads cross-origin, which taints the canvas the
      # tier list exports through — so a newly surfaced archetype has to reach
      # R2 before the snapshot naming it reaches the site.
      - name: Mirror sprites to R2
        env:
          R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME || 'ciphermaniac-reports' }}
        run: npx tsx scripts/mirror-archetype-sprites.ts
