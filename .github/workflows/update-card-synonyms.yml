# =============================================================================
# Update Card Synonyms
# =============================================================================
# Generates card synonyms database for fuzzy search and card name matching.
# Maps alternate names, abbreviations, and common misspellings to canonical names.
#
# Triggers:
#   - Daily at 6:00 AM UTC (captures new tournament ingestions within 24h)
#   - Manual dispatch
# =============================================================================

name: (Card Metadata) Synonyms

run-name: >-
  ${{ github.event_name == 'schedule' && 'Daily Synonyms Update' ||
      format('Synonyms Update (full_rewrite={0})', inputs.full_rewrite) }}

on:
  schedule:
    - cron: '0 6 * * *' # Daily at 6:00 AM UTC
  workflow_dispatch:
    inputs:
      full_rewrite:
        description: 'Full rewrite (ignore existing synonyms cache)'
        required: false
        type: boolean
        default: false

# All R2 bucket writers share one concurrency group so producers and repair
# jobs can never mutate the bucket at the same time (DB-MASTER-PLAN Phase 0).
concurrency:
  group: r2-bucket-writers
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  update-synonyms:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate and upload card synonyms
        id: generate
        run: npx tsx .github/scripts/update-card-synonyms.mjs
        env:
          R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          PUBLIC_R2_BASE_URL: https://r2.ciphermaniac.com
          FULL_REWRITE: ${{ inputs.full_rewrite || 'false' }}

# Event artifacts are rebuilt from immutable sources by the next data release,
# so synonyms and rolling canonical indexes are promoted together.
