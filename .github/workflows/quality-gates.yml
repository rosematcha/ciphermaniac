name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality-gates:
    name: quality-gates
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: verify-${{ github.ref }}
      cancel-in-progress: true
    env:
      QUALITY_BASE: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          python: 'true'
      - run: npx playwright install --with-deps chromium
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run verify
  lighthouse:
    name: lighthouse
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: lighthouse-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ./.github/actions/setup
      - run: npx playwright install --with-deps chromium
      - run: npm run test:lighthouse
  deploy:
    needs: [quality-gates, lighthouse]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: r2-bucket-writers
      queue: max
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
      checks: read
      deployments: write
    env:
      R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME || 'ciphermaniac-reports' }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ./.github/actions/setup
      - name: Embed current immutable data release
        run: npx tsx .github/scripts/prepare-deployment.ts
      - uses: ./.github/actions/deploy
