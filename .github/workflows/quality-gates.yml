name: Quality Gates

# Runs the same command a developer runs locally: `npm run verify`. The steps
# below only exist to install the two runtimes it needs and to keep the failure
# output attributable to a stage — CI must not maintain its own idea of what
# "verified" means, or the local command drifts into meaning less than the
# remote one.

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: .github/scripts/requirements-art.txt

      - name: Install Node dependencies
        run: npm ci

      - name: Install Python dependencies
        # requirements-art.txt includes requirements.txt and adds OpenCV, which
        # the card-art grouping tests import.
        run: pip install -r .github/scripts/requirements-art.txt

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Security audit
        run: npm audit --omit=dev --audit-level=high

      - name: Verify
        run: npm run verify
