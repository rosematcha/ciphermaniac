name: Deploy verified application
description: Deploy a verified code revision with an embedded immutable data release
inputs:
  cloudflare_api_token:
    description: 'Cloudflare API Token'
    required: false
  cloudflare_account_id:
    description: 'Cloudflare Account ID'
    required: false
runs:
  using: composite
  steps:
    - name: Recheck code approval immediately before deployment
      shell: bash
      run: npx tsx .github/scripts/require-verified-code.ts
    - name: Build and enforce bundle budget
      shell: bash
      run: npm run verify:build
    - name: Apply tournament migrations and check the schema
      shell: bash
      env:
        CLOUDFLARE_API_TOKEN: ${{ inputs.cloudflare_api_token || env.CLOUDFLARE_API_TOKEN }}
        CLOUDFLARE_ACCOUNT_ID: ${{ inputs.cloudflare_account_id || env.CLOUDFLARE_ACCOUNT_ID }}
      run: |
        npx wrangler d1 migrations apply ciphermaniac-tournaments --remote
        npx wrangler d1 execute ciphermaniac-tournaments --remote --file=config/d1/check-tournaments.sql
    - name: Record deployment attempt and release marker
      id: attempt
      shell: bash
      run: npx tsx .github/scripts/deployment-state.ts attempt
    - name: Deploy to production
      id: pages
      uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0
      with:
        apiToken: ${{ inputs.cloudflare_api_token || env.CLOUDFLARE_API_TOKEN }}
        accountId: ${{ inputs.cloudflare_account_id || env.CLOUDFLARE_ACCOUNT_ID }}
        command: pages deploy dist --project-name=ciphermaniac --branch=main --commit-hash=${{ github.sha }} --commit-message=ciphermaniac:${{ steps.attempt.outputs.attempt-id }}
    - name: Verify deployed release and conditionally promote
      if: always() && steps.attempt.outcome == 'success'
      shell: bash
      run: npx tsx .github/scripts/update-channel.ts ${{ steps.attempt.outputs.attempt-id }}
