name: Pipeline setup
description: Install the repository runtimes and locked dependencies
inputs:
  python:
    description: Install Python and the locked producer and quality dependencies
    default: 'false'
runs:
  using: composite
  steps:
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
      with:
        node-version-file: .node-version
        cache: npm
    - shell: bash
      run: npm ci
    - if: inputs.python == 'true'
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version-file: .python-version
        cache: pip
        cache-dependency-path: .github/scripts/requirements-quality.txt
    - if: inputs.python == 'true'
      shell: bash
      run: pip install --require-hashes -r .github/scripts/requirements-quality.txt
