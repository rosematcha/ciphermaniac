name: Pipeline setup
description: Install the repository runtimes and locked dependencies
inputs:
  python:
    description: Install Python and the locked producer and quality dependencies
    default: 'false'
runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version-file: .node-version
        cache: npm
    - shell: bash
      run: npm ci
    - if: inputs.python == 'true'
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
      with:
        python-version-file: .python-version
        cache: pip
        cache-dependency-path: .github/scripts/requirements-quality.txt
    - if: inputs.python == 'true'
      shell: bash
      run: pip install --require-hashes -r .github/scripts/requirements-quality.txt
